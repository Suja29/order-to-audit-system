<!DOCTYPE html>
<html>
<head>
    <title>Salesman Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Salesman Portal (User: {{ user }})</h1>
            <a href="/" class="text-red-500 hover:underline">Logout</a>
        </div>

        <h2 class="text-lg font-semibold mb-3">Place New Order</h2>
        <form action="/salesman/order" method="post" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded border">
            <input type="hidden" name="salesman_name" value="{{ user }}">
            <div>
                <label class="block text-sm font-medium">Customer</label>
                <select name="customer_id" class="w-full border p-2 rounded">
                    {% for c in customers %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.state }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Product</label>
                <select name="item_id" class="w-full border p-2 rounded">
                    {% for i in items if i.category == 'FINISHED' %}
                    <option value="{{ i.id }}">{{ i.name }} (₹{{ i.selling_price }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium">Quantity (Packets)</label>
                <input type="number" step="0.01" name="qty" required class="w-full border p-2 rounded" placeholder="150">
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 font-bold">Submit Order</button>
            </div>
        </form>

        <h2 class="text-lg font-semibold mb-3">My Orders & Status</h2>
        <table class="w-full border-collapse border border-gray-300 text-left text-sm">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border p-2">Order ID</th>
                    <th class="border p-2">Customer ID</th>
                    <th class="border p-2">Qty</th>
                    <th class="border p-2">Status</th>
                </tr>
            </thead>
            <tbody>
                {% for o in orders %}
                <tr>
                    <td class="border p-2">#{{ o.id }}</td>
                    <td class="border p-2">{{ o.customer_id }}</td>
                    <td class="border p-2">{{ o.qty }}</td>
                    <td class="border p-2 font-bold text-blue-600">{{ o.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
