<!DOCTYPE html>
<html>
<head>
    <title>Login - Order-to-Audit ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">ERP Login</h2>
        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Username (Role)</label>
                <input type="text" name="username" required placeholder="e.g. salesman_a, admin, supervisor, auditor" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-bold">Login</button>
        </form>
        <div class="mt-4 text-xs text-gray-500 text-center">
            Test users: salesman_a, admin, supervisor, auditor
        </div>
    </div>
</body>
</html>
